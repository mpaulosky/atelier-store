# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
---

version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      all-actions:
        patterns:
          - "*"

  # Maintain dependencies for nuget
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    labels:
      - "nuget"
      - "dependencies"
    groups:
      all-nuget:
        patterns:
          - "*"

  # Maintain DotNet Sdk
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    labels:
      - "dotnet-sdk"
      - "dependencies"
    groups:
      dotnet-sdk:
        patterns:
          - "*"

  # Maintain the web project's pnpm packages (Tailwind CLI)
  - package-ecosystem: "npm"
    directory: "/src/AtelierStore.Web"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    labels:
      - "npm"
      - "dependencies"
    groups:
      all-npm:
        patterns:
          - "*"
